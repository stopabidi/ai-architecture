  <rect x="1189" y="232" width="125" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="1251" y="256" text-anchor="middle" fill="#fff" font-size="9">Muse</text>

  <rect x="1322" y="232" width="118" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="1381" y="256" text-anchor="middle" fill="#fff" font-size="9">Scout</text>

