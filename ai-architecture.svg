  <text x="750" y="784" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">Tailscale Mesh — SSH over Tailscale</text>

  <!-- Connections to Tailscale -->
  <line x1="520" y1="740" x2="600" y2="760" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="1260" y1="740" x2="1100" y2="760" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
