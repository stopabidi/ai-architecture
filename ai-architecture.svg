  <rect x="790" y="278" width="125" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="852" y="302" text-anchor="middle" fill="#fff" font-size="9">Forge</text>

  <rect x="923" y="278" width="125" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="985" y="302" text-anchor="middle" fill="#fff" font-size="9">Ledger</text>

  <rect x="1056" y="278" width="125" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="1118" y="302" text-anchor="middle" fill="#fff" font-size="9">Pulse</text>

  <rect x="1189" y="278" width="125" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="1251" y="302" text-anchor="middle" fill="#fff" font-size="9">Beacon</text>

  <rect x="1322" y="278" width="118" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="1381" y="302" text-anchor="middle" fill="#fff" font-size="9">Lens</text>

  <!-- Tim Specialised Agents Row 3 -->
  <rect x="790" y="324" width="125" height="38" rx="5" fill="url(#sg-tim-agent)" opacity="0.8"/>
  <text x="852" y="348" text-anchor="middle" fill="#fff" font-size="9">Sentinel</text>

  <!-- Beacon label (Google Flash) -->
  <text x="1251" y="330" text-anchor="middle" fill="#fbbf24" font-size="7">Google Flash</text>

  <!-- Tim Capabilities -->
  <text x="790" y="390" fill="#94a3b8" font-size="10" font-weight="600">CAPABILITIES</text>

  <rect x="790" y="400" width="130" height="30" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="855" y="420" text-anchor="middle" fill="#c084fc" font-size="9">Voice + TTS</text>

  <rect x="928" y="400" width="130" height="30" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="993" y="420" text-anchor="middle" fill="#c084fc" font-size="9">Transcription</text>

  <rect x="1066" y="400" width="130" height="30" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1131" y="420" text-anchor="middle" fill="#c084fc" font-size="9">Computer Use</text>

  <rect x="1204" y="400" width="130" height="30" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1269" y="420" text-anchor="middle" fill="#c084fc" font-size="9">Browser Auto</text>

  <rect x="1342" y="400" width="98" height="30" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1391" y="420" text-anchor="middle" fill="#c084fc" font-size="9">Apple</text>

  <rect x="790" y="438" width="650" height="30" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1115" y="458" text-anchor="middle" fill="#c084fc" font-size="9">Meeting Pipeline · Wake Word Detection · MoM Generation · Native CLIs</text>

  <!-- Model info -->
  <rect x="790" y="476" width="650" height="28" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1115" y="494" text-anchor="middle" fill="#94a3b8" font-size="9">Specialised: Qwen3.6 27B · Orchestrator: Gemma4 26B / Qwen3.6 35B</text>

  <!-- ==================== TELEGRAM ==================== -->
  <rect x="30" y="870" width="1440" height="55" rx="12" fill="#1e293b" stroke="#229ed9" stroke-width="1.5"/>
  <text x="60" y="895" fill="#229ed9" font-size="13" font-weight="700">Telegram Group Chats</text>
  <text x="60" y="912" fill="#94a3b8" font-size="10">Multiple group chats, one per agent or team. Hermes routes via custom skills. Talk to any agent directly or let Hermes orchestrate across them. Manage everything from your phone.</text>

  <!-- ==================== DOCKER ==================== -->
  <rect x="30" y="940" width="1440" height="55" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="965" fill="#60a5fa" font-size="13" font-weight="700">Docker Containers</text>
  <text x="60" y="982" fill="#94a3b8" font-size="10">API keys only inside containers, never on host. Hermes, Codex, Open Code, Claude Code all run in Docker.</text>

  <rect x="460" y="952" width="100" height="28" rx="5" fill="url(#sg-docker)" opacity="0.8"/>
