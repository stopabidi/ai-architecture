<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0a0b14"/>
    </radialGradient>
    <linearGradient id="mach-pandora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2d4a"/>
      <stop offset="100%" stop-color="#1e2038"/>
    </linearGradient>
    <linearGradient id="mach-tim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2633"/>
      <stop offset="100%" stop-color="#1e1825"/>
    </linearGradient>
    <linearGradient id="sg-llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sg-agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="sg-db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sg-service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sg-bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sg-board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Local AI Architecture — Pandora + Tim</text>
  <text x="700" y="68" text-anchor="middle" fill="#64748b" font-size="13">All inference runs locally. Connected over Tailscale. Accessed via SSH.</text>

  <!-- ==================== PANDORA ==================== -->
  <rect x="40" y="90" width="940" height="640" rx="16" fill="url(#mach-pandora)" stroke="#3b3d5a" stroke-width="1.5"/>
  <text x="70" y="125" fill="#e2e8f0" font-size="18" font-weight="700">Pandora</text>
  <text x="70" y="145" fill="#64748b" font-size="12">7800X3D · RTX 5070Ti · 32GB · Headless AI Server</text>

  <!-- Inference -->
  <rect x="70" y="170" width="280" height="55" rx="10" fill="url(#sg-llm)" opacity="0.9"/>
  <text x="210" y="195" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">llama-server :8888</text>
  <text x="210" y="213" text-anchor="middle" fill="#e0e7ff" font-size="11">Qwen 3.6 35B + Qwen 3.5 9B Vision</text>

  <!-- Vector DB -->
  <rect x="370" y="170" width="200" height="55" rx="10" fill="url(#sg-db)" opacity="0.9"/>
  <text x="470" y="195" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">ChromaDB :8100</text>
  <text x="470" y="213" text-anchor="middle" fill="#ede9fe" font-size="11">RAG embeddings</text>

  <!-- Kanban -->
  <rect x="590" y="170" width="180" height="55" rx="10" fill="url(#sg-board)" opacity="0.9"/>
  <text x="680" y="195" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Kanban Board</text>
  <text x="680" y="213" text-anchor="middle" fill="#fce7f3" font-size="11">SQLite agent queue</text>

  <!-- Workspace -->
  <rect x="790" y="170" width="170" height="55" rx="10" fill="url(#sg-service)" opacity="0.9"/>
  <text x="875" y="195" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Odysseus :7000</text>
  <text x="875" y="213" text-anchor="middle" fill="#fef3c7" font-size="11">OpenWebUI + n8n</text>

  <!-- === AGENTS ROW 1 === -->
  <text x="70" y="265" fill="#94a3b8" font-size="13" font-weight="600">AGENTS</text>

  <!-- Hermes -->
  <rect x="70" y="280" width="175" height="60" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="157" y="305" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Hermes</text>
  <text x="157" y="322" text-anchor="middle" fill="#cffafe" font-size="11">Orchestrator · Qwen 3.6</text>

  <!-- Frankie -->
  <rect x="260" y="280" width="175" height="60" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="347" y="305" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Frankie</text>
  <text x="347" y="322" text-anchor="middle" fill="#cffafe" font-size="11">Worker · Qwen 3.6</text>

  <!-- Helios -->
  <rect x="450" y="280" width="175" height="60" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="537" y="305" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Helios</text>
  <text x="537" y="322" text-anchor="middle" fill="#cffafe" font-size="11">Analyst · Qwen 3.6</text>

  <!-- Pi -->
  <rect x="640" y="280" width="175" height="60" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="727" y="305" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Pi</text>
  <text x="727" y="322" text-anchor="middle" fill="#cffafe" font-size="11">Specialist · Gemma 4 12B</text>

  <!-- OpenCode -->
  <rect x="830" y="280" width="130" height="60" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="895" y="305" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">OpenCode</text>
  <text x="895" y="322" text-anchor="middle" fill="#cffafe" font-size="11">Coder · Qwen 3.6</text>

  <!-- === BOTS ROW === -->
  <text x="70" y="380" fill="#94a3b8" font-size="13" font-weight="600">BOTS</text>

  <rect x="70" y="395" width="200" height="50" rx="10" fill="url(#sg-bot)" opacity="0.9"/>
  <text x="170" y="425" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">WhatBot v3.5</text>

  <rect x="285" y="395" width="200" height="50" rx="10" fill="url(#sg-bot)" opacity="0.9"/>
  <text x="385" y="425" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">WhatBot Telegram</text>

  <rect x="500" y="395" width="200" height="50" rx="10" fill="url(#sg-bot)" opacity="0.9"/>
  <text x="600" y="425" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Professor (arXiv RAG)</text>

  <!-- === SERVICES ROW === -->
  <text x="70" y="490" fill="#94a3b8" font-size="13" font-weight="600">SELF-HOSTED</text>

  <rect x="70" y="505" width="175" height="45" rx="10" fill="url(#sg-service)" opacity="0.7"/>
  <text x="157" y="533" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">Nextcloud :8081</text>

  <rect x="260" y="505" width="140" height="45" rx="10" fill="url(#sg-service)" opacity="0.7"/>
  <text x="330" y="533" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">Immich (planned)</text>

  <!-- === ORCHESTRATION FLOW === -->
  <text x="70" y="600" fill="#94a3b8" font-size="13" font-weight="600">ORCHESTRATION FLOW</text>
  <text x="70" y="625" fill="#64748b" font-size="12">Hermes (Telegram/WhatsApp) → delegates via custom skills → Frankie · Helios · Pi · OpenCode</text>
  <text x="70" y="648" fill="#64748b" font-size="12">Paperclip (planned) → hierarchical multi-agent company orchestration</text>

  <!-- Connection lines from Pandora to inference -->
  <line x1="157" y1="280" x2="157" y2="225" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="347" y1="280" x2="280" y2="225" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="537" y1="280" x2="450" y2="225" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="727" y1="280" x2="680" y2="225" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="895" y1="280" x2="850" y2="225" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- ==================== TIM ==================== -->
  <rect x="1010" y="90" width="360" height="640" rx="16" fill="url(#mach-tim)" stroke="#3b2d4a" stroke-width="1.5"/>
  <text x="1040" y="125" fill="#e2e8f0" font-size="18" font-weight="700">Tim</text>
  <text x="1040" y="145" fill="#64748b" font-size="12">MacBook Air M2 · 16GB · Portable Agent Host</text>

  <!-- Tim Agents -->
  <text x="1040" y="178" fill="#94a3b8" font-size="13" font-weight="600">HERMES PROFILES</text>

  <rect x="1040" y="195" width="310" height="50" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="1195" y="225" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Agent Tim · Orchestrator</text>

  <rect x="1040" y="260" width="310" height="50" rx="10" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="1195" y="290" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Sentry · Monitor</text>

  <rect x="1040" y="325" width="310" height="50" rx="10" fill="url(#sg-agent)" opacity="0.7"/>
  <text x="1195" y="355" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">+ Specialised Profiles</text>

  <!-- Tim Capabilities -->
  <text x="1040" y="420" fill="#94a3b8" font-size="13" font-weight="600">CAPABILITIES</text>

  <rect x="1040" y="435" width="145" height="40" rx="8" fill="url(#sg-llm)" opacity="0.7"/>
  <text x="1112" y="460" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">Voice + TTS</text>

  <rect x="1200" y="435" width="150" height="40" rx="8" fill="url(#sg-llm)" opacity="0.7"/>
  <text x="1275" y="460" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">Transcription</text>

  <rect x="1040" y="485" width="145" height="40" rx="8" fill="url(#sg-llm)" opacity="0.7"/>
  <text x="1112" y="510" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">Computer Use</text>

  <rect x="1200" y="485" width="150" height="40" rx="8" fill="url(#sg-llm)" opacity="0.7"/>
  <text x="1275" y="510" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">Browser Automation</text>

  <rect x="1040" y="535" width="310" height="40" rx="8" fill="url(#sg-llm)" opacity="0.7"/>
  <text x="1195" y="560" text-anchor="middle" fill="#fff" font-size="11" font-weight="500">Apple Integrations · Meeting Pipeline · Wake Word</text>

  <!-- Tim Model Selection -->
  <rect x="1040" y="600" width="310" height="55" rx="10" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1195" y="622" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">Model Selection</text>
  <text x="1195" y="643" text-anchor="middle" fill="#94a3b8" font-size="11">Qwen 3.6 / Gemma 4 — task-dependent</text>

  <!-- ==================== TAILSCALE ==================== -->
  <rect x="430" y="745" width="540" height="40" rx="10" fill="#1e2038" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="700" y="770" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">Tailscale Mesh — SSH over Tailscale</text>

  <!-- Connection lines to Tailscale -->
  <line x1="510" y1="730" x2="600" y2="745" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="1195" y1="730" x2="1100" y2="745" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
</svg>
