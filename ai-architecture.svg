  <rect x="820" y="148" width="160" height="48" rx="8" fill="url(#sg-service)" opacity="0.7"/>
  <text x="900" y="177" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Nextcloud :8081</text>

