  <text x="60" y="112" fill="#e2e8f0" font-size="18" font-weight="700">Pandora</text>
  <text x="60" y="130" fill="#64748b" font-size="11">7800X3D · RTX 5070Ti · 32GB · Headless AI Server</text>

  <!-- Infrastructure row -->
  <rect x="60" y="148" width="220" height="48" rx="8" fill="url(#sg-llm)" opacity="0.9"/>
  <text x="170" y="177" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">llama-server :8888</text>

  <rect x="295" y="148" width="170" height="48" rx="8" fill="url(#sg-db)" opacity="0.9"/>
  <text x="380" y="177" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">ChromaDB :8100</text>

