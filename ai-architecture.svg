  <rect x="60" y="220" width="650" height="44" rx="8" fill="url(#sg-hermes)" opacity="0.95" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="385" y="242" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Hermes — Chief Orchestrator</text>
  <text x="385" y="258" text-anchor="middle" fill="#cffafe" font-size="9">Multi-agent delegation · Telegram group chats · WhatsApp · Task routing · Dependency resolution · Skill chaining</text>

  <!-- Pandora Agents (Qwen3.6 27B) -->
  <text x="60" y="290" fill="#94a3b8" font-size="10" font-weight="600">PANDORA AGENTS (Qwen3.6 27B)</text>

  <rect x="60" y="300" width="150" height="42" rx="6" fill="url(#sg-local)" opacity="0.85"/>
  <text x="135" y="318" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Frankie</text>
  <text x="135" y="334" text-anchor="middle" fill="#cffafe" font-size="8">Worker</text>

  <rect x="220" y="300" width="150" height="42" rx="6" fill="url(#sg-local)" opacity="0.85"/>
  <text x="295" y="318" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Helios</text>
  <text x="295" y="334" text-anchor="middle" fill="#cffafe" font-size="8">Analyst</text>

  <rect x="380" y="300" width="150" height="42" rx="6" fill="url(#sg-local)" opacity="0.85"/>
  <text x="455" y="318" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Pi</text>
  <text x="455" y="334" text-anchor="middle" fill="#cffafe" font-size="8">Specialist</text>

  <rect x="540" y="300" width="170" height="42" rx="6" fill="url(#sg-local)" opacity="0.85"/>
  <text x="625" y="318" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">OpenCode</text>
  <text x="625" y="334" text-anchor="middle" fill="#cffafe" font-size="8">Coder · Docker</text>

