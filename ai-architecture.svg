  <rect x="1265" y="394" width="195" height="38" rx="6" fill="url(#sg-tim-agent)" opacity="0.7"/>
  <text x="1362" y="418" text-anchor="middle" fill="#fff" font-size="11">Ledger — Finance</text>

  <rect x="1060" y="440" width="195" height="38" rx="6" fill="url(#sg-tim-agent)" opacity="0.7"/>
  <text x="1157" y="464" text-anchor="middle" fill="#fff" font-size="11">Pulse — Markets</text>

  <rect x="1265" y="440" width="195" height="38" rx="6" fill="url(#sg-tim-agent)" opacity="0.7"/>
  <text x="1362" y="464" text-anchor="middle" fill="#fff" font-size="11">Beacon — News</text>

  <rect x="1060" y="486" width="195" height="38" rx="6" fill="url(#sg-tim-agent)" opacity="0.7"/>
  <text x="1157" y="510" text-anchor="middle" fill="#fff" font-size="11">Lens — Documents</text>

  <rect x="1265" y="486" width="195" height="38" rx="6" fill="url(#sg-tim-agent)" opacity="0.7"/>
  <text x="1362" y="510" text-anchor="middle" fill="#fff" font-size="11">Sentinel — Compliance</text>

