  <text x="1376" y="398" text-anchor="middle" fill="#fff" font-size="9">Claude API</text>

  <text x="1060" y="440" fill="#64748b" font-size="9">Hermes, Codex, Open Code, Claude Code all run in Docker</text>

  <!-- ==================== TAILSCALE ==================== -->
  <rect x="350" y="885" width="800" height="34" rx="10" fill="#1e2038" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="750" y="907" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Tailscale Mesh — SSH over Tailscale</text>

