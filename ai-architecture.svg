  <!-- Background -->
  <rect width="1500" height="950" fill="url(#bg)"/>

  <!-- Title -->
  <text x="750" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Local AI Architecture — Pandora + Tim</text>
  <text x="750" y="58" text-anchor="middle" fill="#64748b" font-size="12">Orchestrators and coders run local. Specialised agents use OpenRouter/Google Flash inside Docker containers.</text>

  <!-- ==================== PANDORA ==================== -->
  <rect x="30" y="72" width="980" height="680" rx="16" fill="url(#mach-pandora)" stroke="#3b3d5a" stroke-width="1.5"/>
  <text x="60" y="102" fill="#e2e8f0" font-size="17" font-weight="700">Pandora</text>
  <text x="60" y="118" fill="#64748b" font-size="10">7800X3D · RTX 5070Ti · 32GB · Headless AI Server</text>

  <!-- Infrastructure row -->
  <rect x="60" y="132" width="200" height="42" rx="7" fill="url(#sg-llm)" opacity="0.9"/>
  <text x="160" y="158" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">llama-server :8888</text>

  <rect x="270" y="132" width="150" height="42" rx="7" fill="url(#sg-db)" opacity="0.9"/>
  <text x="345" y="158" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">ChromaDB :8100</text>

  <rect x="430" y="132" width="130" height="42" rx="7" fill="url(#sg-board)" opacity="0.9"/>
  <text x="495" y="158" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Kanban Board</text>

  <rect x="570" y="132" width="140" height="42" rx="7" fill="url(#sg-service)" opacity="0.7"/>
  <text x="640" y="158" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Odysseus :7000</text>

  <rect x="720" y="132" width="140" height="42" rx="7" fill="url(#sg-service)" opacity="0.7"/>
  <text x="790" y="158" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Nextcloud :8081</text>

  <!-- Pandora Agents label -->
  <text x="60" y="200" fill="#94a3b8" font-size="11" font-weight="600">PANDORA AGENTS (LOCAL AI)</text>

  <!-- Hermes -->
  <rect x="60" y="210" width="145" height="48" rx="7" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="132" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Hermes</text>
  <text x="132" y="248" text-anchor="middle" fill="#cffafe" font-size="9">Orchestrator</text>

  <!-- Frankie -->
  <rect x="213" y="210" width="145" height="48" rx="7" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="285" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Frankie</text>
  <text x="285" y="248" text-anchor="middle" fill="#cffafe" font-size="9">Worker</text>

  <!-- Helios -->
  <rect x="366" y="210" width="145" height="48" rx="7" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="438" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Helios</text>
  <text x="438" y="248" text-anchor="middle" fill="#cffafe" font-size="9">Analyst</text>

  <!-- Pi -->
  <rect x="519" y="210" width="145" height="48" rx="7" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="591" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Pi</text>
  <text x="591" y="248" text-anchor="middle" fill="#cffafe" font-size="9">Specialist</text>

  <!-- OpenCode -->
  <rect x="672" y="210" width="145" height="48" rx="7" fill="url(#sg-agent)" opacity="0.9"/>
  <text x="744" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">OpenCode</text>
  <text x="744" y="248" text-anchor="middle" fill="#cffafe" font-size="9">Coder</text>

  <!-- Super Sage (highlighted) -->
  <rect x="825" y="210" width="155" height="48" rx="7" fill="url(#sg-sage)" opacity="0.95" stroke="#fbbf24" stroke-width="2"/>
  <text x="902" y="232" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Super Sage</text>
  <text x="902" y="248" text-anchor="middle" fill="#fef3c7" font-size="9">Planner · Claude API</text>

  <!-- Super Sage connections -->
  <line x1="902" y1="258" x2="132" y2="258" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
  <text x="500" y="273" text-anchor="middle" fill="#fbbf24" font-size="8" opacity="0.6">plans &amp; guides</text>
  <line x1="902" y1="258" x2="744" y2="258" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>

