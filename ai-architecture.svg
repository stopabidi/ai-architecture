  <text x="710" y="148" fill="#8b949e" font-size="11">🐧  llama-server (Qwen models)</text>
  <text x="710" y="168" fill="#8b949e" font-size="11">🐧  ChromaDB vector store</text>
  <text x="710" y="188" fill="#8b949e" font-size="11">🐧  Hermes / Frankie / Helios</text>
  <text x="710" y="208" fill="#8b949e" font-size="11">🐧  OpenCode · Kanban Board</text>
  <text x="710" y="228" fill="#8b949e" font-size="11">🐧  Odysseus (OUI + n8n)</text>
  <text x="710" y="248" fill="#8b949e" font-size="11">🐧  Nextcloud · Immich</text>

  <rect x="700" y="275" width="270" height="26" rx="5" fill="#d29922" opacity="0.3"/>
  <text x="710" y="293" fill="#d29922" font-size="12" font-weight="bold">Tim</text>

  <text x="710" y="318" fill="#8b949e" font-size="11">🍎  AgentTim (remote LLM)</text>
  <text x="710" y="338" fill="#8b949e" font-size="11">🍎  Gina profile</text>
  <text x="710" y="358" fill="#8b949e" font-size="11">🍎  SSH → Frankenstein</text>

  <rect x="700" y="385" width="270" height="26" rx="5" fill="#2ea043" opacity="0.3"/>
  <text x="710" y="403" fill="#2ea043" font-size="12" font-weight="bold">Phone</text>

  <text x="710" y="428" fill="#8b949e" font-size="11">📱  Tailscale → all services</text>
  <text x="710" y="448" fill="#8b949e" font-size="11">📱  Odysseus WebUI</text>
  <text x="710" y="468" fill="#8b949e" font-size="11">📱  Nextcloud sync</text>

  <text x="700" y="510" fill="#e6edf3" font-size="14" font-weight="bold">▸ Key Ports</text>

  <rect x="700" y="525" width="270" height="160" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="715" y="548" fill="#e6edf3" font-size="11">:8888  llama-server</text>
  <text x="715" y="568" fill="#8b949e" font-size="11">:7000  Odysseus</text>
  <text x="715" y="588" fill="#8b949e" font-size="11">:8081  Nextcloud</text>
  <text x="715" y="608" fill="#8b949e" font-size="11">:8100  ChromaDB</text>
  <text x="715" y="628" fill="#8b949e" font-size="11">:22    SSH</text>
  <text x="715" y="648" fill="#8b949e" font-size="11">:8200  Pandora MCP</text>
  <text x="715" y="668" fill="#8b949e" font-size="11">:80    nginx</text>

  <!-- Legend -->
  <text x="700" y="720" fill="#e6edf3" font-size="14" font-weight="bold">▸ Agent Models</text>

  <rect x="700" y="733" width="270" height="120" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="715" y="753" fill="#a78bfa" font-size="11">◆ Hermes — DeepSeek V4 Pro</text>
  <text x="715" y="773" fill="#d29922" font-size="11">◆ Frankie — DeepSeek V4 Flash</text>
  <text x="715" y="793" fill="#d29922" font-size="11">◆ Helios — DeepSeek V4 Pro</text>
  <text x="715" y="813" fill="#58a6ff" font-size="11">◆ OpenCode — Qwen 35B A3B</text>
  <text x="715" y="833" fill="#a78bfa" font-size="11">◆ AgentTim — DeepSeek V4 Flash</text>
</svg>
