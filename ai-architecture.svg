  <text x="1125" y="590" text-anchor="middle" fill="#c084fc" font-size="10">Voice + TTS</text>

  <rect x="1200" y="568" width="130" height="36" rx="6" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1265" y="590" text-anchor="middle" fill="#c084fc" font-size="10">Transcription</text>

  <rect x="1340" y="568" width="120" height="36" rx="6" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1400" y="590" text-anchor="middle" fill="#c084fc" font-size="10">Computer Use</text>

  <rect x="1060" y="612" width="200" height="36" rx="6" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1160" y="634" text-anchor="middle" fill="#c084fc" font-size="10">Browser Automation</text>

  <rect x="1270" y="612" width="190" height="36" rx="6" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1365" y="634" text-anchor="middle" fill="#c084fc" font-size="10">Apple Integrations</text>

  <rect x="1060" y="656" width="400" height="36" rx="6" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1260" y="678" text-anchor="middle" fill="#c084fc" font-size="10">Meeting Pipeline · Wake Word · MoM Generation</text>

