  <!-- Background -->
  <rect width="1500" height="1050" fill="url(#bg)"/>

  <!-- Title -->
  <text x="750" y="36" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="700">Local AI Architecture — Pandora + Tim</text>
  <text x="750" y="56" text-anchor="middle" fill="#64748b" font-size="11">Hermes: Gemma4 26B / Qwen3.6 35B · Specialised: Qwen3.6 27B · Planner: Claude API · News: Google Flash</text>

  <!-- ==================== PANDORA ==================== -->
  <rect x="30" y="68" width="700" height="780" rx="16" fill="url(#mach-pandora)" stroke="#3b3d5a" stroke-width="1.5"/>
  <text x="60" y="98" fill="#e2e8f0" font-size="17" font-weight="700">Pandora</text>
  <text x="60" y="114" fill="#64748b" font-size="10">7800X3D · RTX 5070Ti · 32GB DDR5 · Headless AI Server</text>

  <!-- Infrastructure -->
  <text x="60" y="140" fill="#94a3b8" font-size="10" font-weight="600">INFRASTRUCTURE</text>

  <rect x="60" y="150" width="160" height="36" rx="6" fill="url(#sg-llm)" opacity="0.9"/>
  <text x="140" y="173" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">llama-server :8888</text>

  <rect x="230" y="150" width="130" height="36" rx="6" fill="url(#sg-db)" opacity="0.9"/>
  <text x="295" y="173" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">ChromaDB :8100</text>

  <rect x="370" y="150" width="100" height="36" rx="6" fill="url(#sg-board)" opacity="0.9"/>
  <text x="420" y="173" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Kanban</text>

  <rect x="480" y="150" width="120" height="36" rx="6" fill="url(#sg-service)" opacity="0.7"/>
  <text x="540" y="173" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Odysseus :7000</text>

  <rect x="610" y="150" width="110" height="36" rx="6" fill="url(#sg-service)" opacity="0.7"/>
  <text x="665" y="173" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Nextcloud</text>

  <!-- Hermes (Orchestrator) -->
