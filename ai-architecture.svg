  <line x1="1255" y1="465" x2="1255" y2="810" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.3"/>
  <line x1="520" y1="865" x2="520" y2="885" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
