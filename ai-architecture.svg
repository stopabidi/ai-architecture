<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" font-family="'SF Mono','JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="grad-server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="grad-agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="grad-worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="grad-service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="grad-kanban" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <marker id="arrow-down" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-up" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L5,0 L10,8" fill="#8b949e"/>
    </marker>
    <marker id="arrow-right" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="920" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold" font-family="-apple-system,sans-serif">AI Architecture — Multi-Agent System</text>
  <line x1="200" y1="50" x2="900" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- ====== MACHINE 1: FRANKENSTEIN ====== -->
  <rect x="20" y="70" width="660" height="830" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="40" y="96" fill="#e6edf3" font-size="14" font-weight="bold">Frankenstein</text>
  <text x="40" y="114" fill="#8b949e" font-size="10">7800X3D · RTX 5070Ti 16GB · DDR5 32GB · Ubuntu</text>

  <!-- Hardware strip -->
  <rect x="40" y="130" width="200" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="50" y="149" fill="#e6edf3" font-size="11">CPU</text>
  <text x="50" y="164" fill="#8b949e" font-size="10">AMD 7800X3D (8C/16T)</text>
  <rect x="250" y="130" width="200" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="260" y="149" fill="#e6edf3" font-size="11">GPU</text>
  <text x="260" y="164" fill="#8b949e" font-size="10">RTX 5070Ti (16GB VRAM)</text>
  <rect x="460" y="130" width="200" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="470" y="149" fill="#e6edf3" font-size="11">RAM</text>
  <text x="470" y="164" fill="#8b949e" font-size="10">DDR5 6000MT/s · 32GB</text>

  <!-- llama-server -->
  <rect x="40" y="190" width="280" height="70" rx="8" fill="url(#grad-server)"/>
  <text x="55" y="214" fill="#fff" font-size="13" font-weight="bold">llama-server :8888</text>
  <text x="55" y="230" fill="#b5f0c5" font-size="10">Qwen3.6-35B-A3B · Q4_K_M · 123 tok/s</text>
  <text x="55" y="245" fill="#b5f0c5" font-size="10">Qwen3.5-9B-UD + mmproj-F16 (Vision)</text>

  <!-- ChromaDB -->
  <rect x="340" y="190" width="320" height="70" rx="8" fill="url(#grad-service)"/>
  <text x="355" y="214" fill="#fff" font-size="13" font-weight="bold">ChromaDB</text>
  <text x="355" y="230" fill="#ddd6fe" font-size="10">Vector store · Document chunks</text>
  <text x="355" y="245" fill="#ddd6fe" font-size="10">Embeddings · Semantic retrieval</text>

  <!-- ====== AGENT LAYER ====== -->
  <text x="40" y="298" fill="#e6edf3" font-size="13" font-weight="bold">▸ Agent Layer</text>

  <!-- Hermes (Orchestrator) -->
  <rect x="40" y="310" width="620" height="50" rx="8" fill="url(#grad-agent)"/>
  <text x="55" y="332" fill="#fff" font-size="13" font-weight="bold">Hermes  ◈ Orchestrator</text>
  <text x="55" y="348" fill="#b9d6ff" font-size="10">DeepSeek V4 Pro · Decomposes goals · Links tasks · Reviews handoffs · Fix-vs-rebuild decision</text>

  <!-- Frankie -->
  <rect x="40" y="370" width="300" height="70" rx="8" fill="url(#grad-worker)"/>
  <text x="55" y="392" fill="#fff" font-size="13" font-weight="bold">Frankie  ◈ Worker</text>
  <text x="55" y="408" fill="#f0e6c0" font-size="10">DeepSeek V4 Flash</text>
  <text x="55" y="423" fill="#f0e6c0" font-size="10">Benchmarks · Deploys · Tests</text>

  <!-- Helios -->
  <rect x="360" y="370" width="300" height="70" rx="8" fill="url(#grad-worker)"/>
  <text x="375" y="392" fill="#fff" font-size="13" font-weight="bold">Helios  ◈ Checkpoint Analyst</text>
  <text x="375" y="408" fill="#f0e6c0" font-size="10">DeepSeek V4 Pro</text>
  <text x="375" y="423" fill="#f0e6c0" font-size="10">One-time analysis · Fix vs rebuild report</text>

  <!-- OpenCode -->
  <rect x="40" y="450" width="300" height="70" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="55" y="472" fill="#58a6ff" font-size="13" font-weight="bold">OpenCode  ◈ Coding Agent</text>
  <text x="55" y="488" fill="#8b949e" font-size="10">Qwen 35B A3B (local via llama-server)</text>
  <text x="55" y="503" fill="#8b949e" font-size="10">Writes scripts · Scoring · Test suites</text>

  <!-- Kanban Board -->
  <rect x="360" y="450" width="300" height="70" rx="8" fill="url(#grad-kanban)"/>
  <text x="375" y="472" fill="#fff" font-size="13" font-weight="bold">Kanban Board  ⚡</text>
  <text x="375" y="488" fill="#fbbfb9" font-size="10">SQLite · Multi-agent work queue</text>
  <text x="375" y="503" fill="#fbbfb9" font-size="10">Dependency chaining · Dispatcher</text>

  <!-- ====== APPLICATION LAYER ====== -->
  <text x="40" y="558" fill="#e6edf3" font-size="13" font-weight="bold">▸ Application Layer</text>

  <!-- Flask App -->
  <rect x="40" y="570" width="200" height="70" rx="8" fill="#21262d" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="55" y="592" fill="#d2a8ff" font-size="13" font-weight="bold">FastAPI App</text>
  <text x="55" y="608" fill="#8b949e" font-size="10">Query /api/query</text>
  <text x="55" y="623" fill="#8b949e" font-size="10">Ingest · Upload · Delete</text>

  <!-- SMB Watcher -->
  <rect x="260" y="570" width="200" height="70" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="275" y="592" fill="#d29922" font-size="13" font-weight="bold">SMB Watcher</text>
  <text x="275" y="608" fill="#8b949e" font-size="10">Watches shared directory</text>
  <text x="275" y="623" fill="#8b949e" font-size="10">Auto-triggers indexing</text>

  <!-- WhatsApp Gateway -->
  <rect x="480" y="570" width="200" height="70" rx="8" fill="#21262d" stroke="#2ea043" stroke-width="1.5"/>
  <text x="495" y="592" fill="#2ea043" font-size="13" font-weight="bold">WhatsApp Gateway</text>
  <text x="495" y="608" fill="#8b949e" font-size="10">Single dedicated number</text>
  <text x="495" y="623" fill="#8b949e" font-size="10">Query interface</text>

  <!-- Odysseus -->
  <rect x="40" y="655" width="200" height="50" rx="8" fill="#21262d" stroke="#8b5cf6" stroke-width="1"/>
  <text x="55" y="676" fill="#8b5cf6" font-size="11" font-weight="bold">Odysseus</text>
  <text x="55" y="690" fill="#8b949e" font-size="9">OpenWebUI + n8n</text>

  <!-- ====== MACHINE 2: TIM ====== -->
  <rect x="710" y="70" width="370" height="810" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="730" y="96" fill="#e6edf3" font-size="14" font-weight="bold">Tim</text>
  <text x="730" y="114" fill="#8b949e" font-size="10">MacBook Air M2 · 16GB · macOS</text>

  <rect x="730" y="140" width="200" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="740" y="159" fill="#e6edf3" font-size="11">Apple M2</text>
  <text x="740" y="174" fill="#8b949e" font-size="10">8 CPU cores · 16GB unified</text>

  <!-- AgentTim -->
  <rect x="730" y="200" width="330" height="60" rx="8" fill="url(#grad-agent)"/>
  <text x="745" y="222" fill="#fff" font-size="13" font-weight="bold">AgentTim  ◈ Secondary Agent</text>
  <text x="745" y="240" fill="#b9d6ff" font-size="10">DeepSeek V4 Flash · Manages MacBook</text>
  <text x="745" y="254" fill="#b9d6ff" font-size="10">Remote inference via Frankenstein llama-server</text>

  <!-- Gina Profile -->
  <rect x="730" y="275" width="330" height="55" rx="8" fill="#21262d" stroke="#a78bfa" stroke-width="1"/>
  <text x="745" y="295" fill="#a78bfa" font-size="12" font-weight="bold">Gina Profile</text>
  <text x="745" y="313" fill="#8b949e" font-size="10">Daily briefings · Summaries · AI Studio Gemini Flash</text>

  <!-- Tailscale -->
  <rect x="730" y="350" width="330" height="50" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="745" y="372" fill="#58a6ff" font-size="13" font-weight="bold">Tailscale Tailnet</text>
  <text x="745" y="390" fill="#8b949e" font-size="10">Mesh VPN · SSH both ways · SMB share · Port forwarding</text>

  <!-- ====== TASK PIPELINE (right side on Tim) ====== -->
  <text x="730" y="430" fill="#e6edf3" font-size="13" font-weight="bold">▸ Task Pipeline (Kanban)</text>
  
  <!-- Pipeline boxes -->
  <rect x="730" y="445" width="330" height="32" rx="6" fill="#21262d" stroke="#2ea043" stroke-width="1"/>
  <text x="745" y="466" fill="#2ea043" font-size="11">P0: Prerequisites</text>
  <text x="895" y="466" fill="#8b949e" font-size="10" text-anchor="end">✓</text>
  <line x1="895" y1="477" x2="895" y2="488" stroke="#30363d" stroke-width="1.5"/>

  <rect x="730" y="488" width="330" height="32" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="745" y="509" fill="#d29922" font-size="11">P1: Document Ingestion Benchmark</text>
  <text x="895" y="509" fill="#d29922" font-size="10" text-anchor="end">Frankie</text>
  <line x1="895" y1="520" x2="895" y2="531" stroke="#30363d" stroke-width="1.5"/>

  <rect x="730" y="531" width="330" height="32" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="745" y="552" fill="#d29922" font-size="11">P2: Retrieval Accuracy</text>
  <text x="895" y="552" fill="#d29922" font-size="10" text-anchor="end">Frankie</text>
  <line x1="895" y1="563" x2="895" y2="574" stroke="#30363d" stroke-width="1.5"/>

  <rect x="730" y="574" width="330" height="32" rx="6" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="745" y="595" fill="#d29922" font-size="11">P3: Edge Cases (15/15)</text>
  <text x="895" y="595" fill="#d29922" font-size="10" text-anchor="end">Frankie</text>
  <line x1="895" y1="606" x2="895" y2="617" stroke="#30363d" stroke-width="1.5"/>

  <rect x="730" y="617" width="330" height="32" rx="6" fill="#21262d" stroke="#a78bfa" stroke-width="1"/>
  <text x="745" y="638" fill="#a78bfa" font-size="11">⤳ Helios: Fix vs Rebuild Analysis</text>
  <text x="895" y="638" fill="#a78bfa" font-size="10" text-anchor="end">Helios</text>
  <line x1="895" y1="649" x2="895" y2="660" stroke="#30363d" stroke-width="1.5"/>

  <rect x="730" y="660" width="330" height="32" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="745" y="681" fill="#f85149" font-size="11">P4: Production Resilience (soak)</text>
  <text x="895" y="681" fill="#f85149" font-size="10" text-anchor="end">Frankie</text>
  <line x1="895" y1="692" x2="895" y2="703" stroke="#30363d" stroke-width="1.5"/>

  <rect x="730" y="703" width="330" height="32" rx="6" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="745" y="724" fill="#f85149" font-size="11">P5: End-to-End (manual)</text>
  <text x="895" y="724" fill="#f85149" font-size="10" text-anchor="end">Asnan + Frankie</text>

  <!-- ====== WHOLE SYSTEM FLOW ====== -->
  <text x="40" y="740" fill="#e6edf3" font-size="13" font-weight="bold">▸ Data Flow</text>

  <!-- Flow boxes -->
  <rect x="40" y="755" width="90" height="35" rx="6" fill="#21262d" stroke="#58a6ff"/>
  <text x="85" y="777" fill="#58a6ff" font-size="10" text-anchor="middle">Professor</text>
  
  <text x="145" y="777" fill="#8b949e" font-size="14">→</text>

  <rect x="165" y="755" width="90" height="35" rx="6" fill="#21262d" stroke="#d29922"/>
  <text x="210" y="777" fill="#d29922" font-size="10" text-anchor="middle">SMB Drop</text>

  <text x="270" y="777" fill="#8b949e" font-size="14">→</text>

  <rect x="290" y="755" width="90" height="35" rx="6" fill="#21262d" stroke="#2ea043"/>
  <text x="335" y="777" fill="#2ea043" font-size="10" text-anchor="middle">Watcher</text>

  <text x="395" y="777" fill="#8b949e" font-size="14">→</text>

  <rect x="415" y="755" width="100" height="35" rx="6" fill="#21262d" stroke="#8b5cf6"/>
  <text x="465" y="777" fill="#8b5cf6" font-size="10" text-anchor="middle">Ingestion</text>

  <text x="530" y="777" fill="#8b949e" font-size="14">→</text>

  <rect x="550" y="755" width="110" height="35" rx="6" fill="#21262d" stroke="#a78bfa"/>
  <text x="605" y="777" fill="#a78bfa" font-size="10" text-anchor="middle">ChromaDB</text>

  <!-- Query flow -->
  <rect x="40" y="800" width="90" height="35" rx="6" fill="#21262d" stroke="#2ea043"/>
  <text x="85" y="822" fill="#2ea043" font-size="10" text-anchor="middle">WhatsApp</text>

  <text x="145" y="822" fill="#8b949e" font-size="14">→</text>

  <rect x="165" y="800" width="110" height="35" rx="6" fill="#21262d" stroke="#d2a8ff"/>
  <text x="220" y="822" fill="#d2a8ff" font-size="10" text-anchor="middle">FastAPI Query</text>

  <text x="290" y="822" fill="#8b949e" font-size="14">→</text>

  <rect x="310" y="800" width="100" height="35" rx="6" fill="#21262d" stroke="#a78bfa"/>
  <text x="360" y="822" fill="#a78bfa" font-size="10" text-anchor="middle">ChromaDB</text>

  <text x="425" y="822" fill="#8b949e" font-size="14">+</text>

  <rect x="445" y="800" width="100" height="35" rx="6" fill="url(#grad-server)"/>
  <text x="495" y="822" fill="#b5f0c5" font-size="10" text-anchor="middle">LLM</text>

  <text x="560" y="822" fill="#8b949e" font-size="14">→</text>

  <rect x="580" y="800" width="80" height="35" rx="6" fill="#21262d" stroke="#2ea043"/>
  <text x="620" y="822" fill="#2ea043" font-size="10" text-anchor="middle">Reply</text>

  <!-- Legend -->
  <text x="40" y="870" fill="#8b949e" font-size="10">
Agent Colors:  ■ Hermes (Orch.)  ■ Frankie/Helios (Worker)  ■ Services  ■ Kanban
  </text>
</svg>
