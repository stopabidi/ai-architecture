<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'SF Mono','JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="grad-franken" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="grad-tim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="grad-agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="grad-llm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="grad-service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    <linearGradient id="grad-selfhost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>

    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#58a6ff" flood-opacity="0.3"/>
    </filter>

    <marker id="arrow-down" markerWidth="10" markerHeight="8" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-up" markerWidth="10" markerHeight="8" refX="5" refY="0" orient="auto">
      <path d="M0,8 L5,0 L10,8" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="900" fill="url(#bg)" rx="12"/>
  
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold" font-family="-apple-system,sans-serif">AI Architecture</text>
  <line x1="200" y1="50" x2="800" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- ====== FRANKENSTEIN ====== -->
  <rect x="20" y="70" width="640" height="750" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2" opacity="0.98"/>
  <rect x="20" y="70" width="640" height="36" rx="10" fill="url(#grad-franken)" opacity="0.9"/>
  <rect x="20" y="96" width="640" height="10" fill="url(#grad-franken)" opacity="0.9"/>
  <text x="40" y="94" fill="#fff" font-size="15" font-weight="bold">Frankenstein</text>
  <text x="340" y="94" fill="#b9d6ff" font-size="11">7800X3D · RTX 5070Ti · DDR5 32GB · Ubuntu</text>

  <!-- Machine Zone: Inference -->
  <text x="40" y="130" fill="#8b949e" font-size="11" font-weight="bold">▸ Inference</text>

  <rect x="40" y="142" width="600" height="60" rx="8" fill="url(#grad-llm)" filter="url(#glow)"/>
  <text x="55" y="164" fill="#fff" font-size="14" font-weight="bold">llama-server :8888</text>
  <text x="55" y="182" fill="#b5f0c5" font-size="11">Qwen3.6-35B-A3B · Q4_K_M · ~123 tok/s</text>
  <text x="55" y="196" fill="#b5f0c5" font-size="11">Qwen3.5-9B-UD + mmproj-F16 (Vision)</text>

  <!-- Machine Zone: Agents -->
  <text x="40" y="230" fill="#8b949e" font-size="11" font-weight="bold">▸ Agent Layer</text>

  <rect x="40" y="242" width="285" height="48" rx="7" fill="url(#grad-agent)"/>
  <text x="55" y="262" fill="#fff" font-size="13" font-weight="bold">Hermes  ◈ Orchestrator</text>
  <text x="55" y="279" fill="#ddd6fe" font-size="10">DeepSeek V4 Pro · Decomposes · Links · Reviews</text>

  <rect x="355" y="242" width="285" height="48" rx="7" fill="#21262d" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="370" y="262" fill="#a78bfa" font-size="13" font-weight="bold">Kanban Board  ⚡</text>
  <text x="370" y="279" fill="#8b949e" font-size="10">SQLite · Multi-agent work queue</text>

  <rect x="40" y="300" width="185" height="48" rx="7" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="55" y="320" fill="#d29922" font-size="13" font-weight="bold">Frankie  ◈ Worker</text>
  <text x="55" y="337" fill="#8b949e" font-size="10">DeepSeek V4 Flash</text>

  <rect x="240" y="300" width="185" height="48" rx="7" fill="#21262d" stroke="#d29922" stroke-width="1"/>
  <text x="255" y="320" fill="#d29922" font-size="13" font-weight="bold">Helios  ◈ Analyst</text>
  <text x="255" y="337" fill="#8b949e" font-size="10">DeepSeek V4 Pro · Checkpoint</text>

  <rect x="440" y="300" width="200" height="48" rx="7" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="455" y="320" fill="#58a6ff" font-size="13" font-weight="bold">OpenCode ◈ Coder</text>
  <text x="455" y="337" fill="#8b949e" font-size="10">Qwen 35B A3B (local)</text>

  <!-- ChromaDB -->
  <rect x="40" y="365" width="300" height="48" rx="7" fill="#21262d" stroke="#a78bfa" stroke-width="1.5"/>
