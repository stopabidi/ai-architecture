  <rect x="1193" y="290" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1255" y="310" text-anchor="middle" fill="#fff" font-size="9">Tracker — ClickUp</text>

  <rect x="1326" y="290" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1388" y="310" text-anchor="middle" fill="#fff" font-size="9">Muse — Brainstorm</text>

  <rect x="1060" y="330" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1122" y="350" text-anchor="middle" fill="#fff" font-size="9">Scout — Job Hunt</text>

  <rect x="1193" y="330" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1255" y="350" text-anchor="middle" fill="#fff" font-size="9">Ledger — Finance</text>

  <rect x="1326" y="330" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1388" y="350" text-anchor="middle" fill="#fff" font-size="9">Pulse — Markets</text>

  <rect x="1060" y="370" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1122" y="390" text-anchor="middle" fill="#fff" font-size="9">Beacon — News</text>

  <rect x="1193" y="370" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1255" y="390" text-anchor="middle" fill="#fff" font-size="9">Lens — Documents</text>

  <rect x="1326" y="370" width="125" height="32" rx="5" fill="url(#sg-cloud)" opacity="0.7"/>
  <text x="1388" y="390" text-anchor="middle" fill="#fff" font-size="9">Sentinel — Compliance</text>

  <!-- Capabilities -->
  <text x="1060" y="432" fill="#94a3b8" font-size="11" font-weight="600">CAPABILITIES</text>

  <rect x="1060" y="442" width="120" height="32" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1120" y="462" text-anchor="middle" fill="#c084fc" font-size="9">Voice + TTS</text>

  <rect x="1188" y="442" width="120" height="32" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1248" y="462" text-anchor="middle" fill="#c084fc" font-size="9">Transcription</text>

  <rect x="1316" y="442" width="135" height="32" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1383" y="462" text-anchor="middle" fill="#c084fc" font-size="9">Computer Use</text>

  <rect x="1060" y="482" width="190" height="32" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1155" y="502" text-anchor="middle" fill="#c084fc" font-size="9">Browser Automation</text>

  <rect x="1258" y="482" width="192" height="32" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1354" y="502" text-anchor="middle" fill="#c084fc" font-size="9">Apple Integrations</text>

  <rect x="1060" y="522" width="390" height="32" rx="5" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1255" y="542" text-anchor="middle" fill="#c084fc" font-size="9">Meeting Pipeline · Wake Word · MoM Generation</text>

  <!-- Model selection -->
  <rect x="1060" y="566" width="390" height="34" rx="7" fill="#1e1825" stroke="#4a3d5c" stroke-width="1"/>
  <text x="1255" y="587" text-anchor="middle" fill="#94a3b8" font-size="10">Qwen 3.6 / Gemma 4 — model switches per agent task</text>

  <!-- ==================== DOCKER ==================== -->
  <rect x="30" y="770" width="1440" height="70" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="796" fill="#60a5fa" font-size="13" font-weight="700">Docker Containers</text>
  <text x="60" y="814" fill="#94a3b8" font-size="10">API keys stay inside containers only. Never on the host. Hermes, Codex, Open Code, Claude Code all run in Docker.</text>

  <rect x="500" y="780" width="110" height="30" rx="5" fill="url(#sg-docker)" opacity="0.8"/>
  <text x="555" y="800" text-anchor="middle" fill="#fff" font-size="9" font-weight="500">OpenRouter</text>

  <rect x="620" y="780" width="110" height="30" rx="5" fill="url(#sg-docker)" opacity="0.8"/>
  <text x="675" y="800" text-anchor="middle" fill="#fff" font-size="9" font-weight="500">Google Flash</text>

  <rect x="740" y="780" width="110" height="30" rx="5" fill="url(#sg-docker)" opacity="0.8"/>
  <text x="795" y="800" text-anchor="middle" fill="#fff" font-size="9" font-weight="500">Claude API</text>

  <!-- ==================== TAILSCALE ==================== -->
  <rect x="350" y="860" width="800" height="36" rx="10" fill="#1e2038" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="750" y="883" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Tailscale Mesh — SSH over Tailscale</text>

  <!-- Connections -->
  <line x1="520" y1="752" x2="600" y2="770" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="1260" y1="752" x2="1100" y2="770" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="600" y1="840" x2="600" y2="860" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="1100" y1="840" x2="1100" y2="860" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
</svg>
