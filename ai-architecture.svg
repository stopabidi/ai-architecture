  <rect x="380" y="746" width="240" height="34" rx="6" fill="#21262d" stroke="#2ea043" stroke-width="1.5"/>
  <text x="395" y="763" fill="#2ea043" font-size="11" font-weight="bold">Tailscale App</text>
  <text x="395" y="776" fill="#8b949e" font-size="9">Access self-hosted services</text>

  <rect x="380" y="786" width="240" height="28" rx="6" fill="#21262d" stroke="#8b5cf6" stroke-width="1"/>
  <text x="395" y="804" fill="#8b5cf6" font-size="10">Nextcloud · Odysseus · Immich</text>

