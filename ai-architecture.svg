  <line x1="132" y1="210" x2="160" y2="174" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
  <line x1="285" y1="210" x2="220" y2="174" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
  <line x1="438" y1="210" x2="345" y2="174" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
  <line x1="591" y1="210" x2="495" y2="174" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
  <line x1="744" y1="210" x2="640" y2="174" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>

  <!-- Flow text -->
  <text x="60" y="300" fill="#94a3b8" font-size="11" font-weight="600">ORCHESTRATION</text>
  <text x="60" y="316" fill="#64748b" font-size="10">Hermes (Telegram/WhatsApp) → custom skills → all agents</text>
  <text x="60" y="332" fill="#64748b" font-size="10">Super Sage → plans, troubleshoots, analyzes code via Claude API → guides everyone</text>

  <!-- ==================== TIM ==================== -->
  <rect x="1030" y="72" width="440" height="680" rx="16" fill="url(#mach-tim)" stroke="#3b2d4a" stroke-width="1.5"/>
