  <text x="1060" y="118" fill="#64748b" font-size="10">MacBook Air M2 · 16GB · Portable Agent Host</text>

  <text x="1060" y="144" fill="#94a3b8" font-size="11" font-weight="600">HERMES PROFILES (LOCAL AI)</text>

  <rect x="1060" y="154" width="390" height="36" rx="6" fill="url(#sg-tim-agent)" opacity="0.9"/>
  <text x="1255" y="177" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Agent Tim — Chief Orchestrator</text>

