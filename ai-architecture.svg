  <rect x="570" y="952" width="100" height="28" rx="5" fill="url(#sg-docker)" opacity="0.8"/>
  <text x="620" y="971" text-anchor="middle" fill="#fff" font-size="9">Google Flash</text>

  <rect x="680" y="952" width="100" height="28" rx="5" fill="url(#sg-docker)" opacity="0.8"/>
  <text x="730" y="971" text-anchor="middle" fill="#fff" font-size="9">Claude API</text>

  <!-- ==================== TAILSCALE ==================== -->
  <rect x="350" y="1010" width="800" height="32" rx="10" fill="#1e2038" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="750" y="1031" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Tailscale Mesh — SSH over Tailscale</text>

