  <!-- Super Sage connection to Hermes -->
  <line x1="385" y1="380" x2="385" y2="264" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
  <text x="400" y="340" fill="#fbbf24" font-size="8" opacity="0.6">plans &amp; guides</text>

  <!-- Connections to inference -->
  <line x1="135" y1="220" x2="140" y2="186" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
  <line x1="295" y1="220" x2="295" y2="186" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>

  <!-- Pandora Flow -->
  <text x="60" y="455" fill="#94a3b8" font-size="10" font-weight="600">ORCHESTRATION</text>
  <text x="60" y="472" fill="#64748b" font-size="9">Hermes delegates via Telegram group chats and WhatsApp</text>
  <text x="60" y="487" fill="#64748b" font-size="9">Super Sage plans, troubleshoots, analyses code</text>

